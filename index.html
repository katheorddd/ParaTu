<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>30 de septiembre · Hot Wheels</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Caveat:wght@600&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body>
<canvas id="cv"></canvas>
<button id="mute">🔊</button>

<section class="sc on" id="lock">
  <h1 class="big">Descubre la contraseña</h1>
  <p>Pista: la fecha de hoy (día y mes)</p>
  <div class="boxes" id="boxes"></div>
  <div class="pad" id="pad"></div>
  <div class="flames"></div>
</section>

<section class="sc" id="story"><button class="back" id="sback">‹ Atrás</button><div class="dots" id="dots"></div></section>

<section class="sc" id="gal">
  <button class="back" id="gback">‹ Ver historia</button>
  <h2 class="big">Para ti niño tierno 🏀🏎️</h2>
  <button class="btn alt" id="play">🏀 Jugar básquet</button>
  <button class="btn" id="open">💌 Algo especial para ti</button>
</section>

<section class="sc" id="game">
  <canvas id="gc"></canvas>
  <button class="back" id="ggback">‹ Volver</button>
  <div class="hud"><b>🏀 <span id="sc">0</span> / 5</b></div>
  <div id="tip">Arrastra hacia abajo y suelta para tirar</div>
  <div id="win"><div class="big">¡Felicidades lindo sjjsj! </div><div style="font-size:20px">5 canastas, tienes algo esperándote</div>
    <button class="btn alt show" id="w1">💌 Para tiii</button><button class="btn show" id="w2" style="background:#fff3;box-shadow:none">Seguir jugando</button></div>
</section>

<section class="sc" id="letter">
  <button class="back" id="lback">‹ Volver</button>
  <div class="paper" id="paper"></div>
</section>

<script src="script.js"></script></body></html>
